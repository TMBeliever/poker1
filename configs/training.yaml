# Training Pipeline Configuration
base_cfr:
  iterations: 1000
  traversals_per_iteration: 200
  memory_size: 300000
  learning_rate: 0.00001
  batch_size: 128
  save_interval: 100
  device: "cpu"

tournament_cfr:
  iterations: 500
  traversals_per_iteration: 100
  batch_size: 64
  learning_rate: 0.00005
  tourn_embedding_dim: 64
  save_dir: "models/tournament"

curriculum:
  p1_iterations: 10
  p2_prelim_rounds: 5
  p3_semifinal_hands: 10
  p4_final_hands: 15
  p5_full_tournaments: 2

counterfactual_replay:
  enabled: true
  capacity: 100000
  alpha: 0.6
  beta_start: 0.4
  beta_end: 1.0
  bubble_multiplier: 2.5
  large_pot_multiplier: 2.0

hybrid_cfr:
  base_checkpoint: "models/long_train_5h/mixed_checkpoint_iter_18000.pt"
  checkpoint_dir: "models/long_train_5h"
  profiles_path: "data/profiles/opponent_profiles.json"
  profile_ratio: 0.5
  iterations: 1000
  traversals_per_iteration: 20
  refresh_interval: 50
  save_interval: 100
  eval_interval: 50
  eval_games: 100
  save_dir: "models/hybrid"
  log_dir: "logs/hybrid"

